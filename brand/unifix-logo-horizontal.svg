<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" role="img" aria-labelledby="unifix-h-title">
  <title id="unifix-h-title">UNIFIX</title>
  <desc>UNIFIX location-pin mark next to the UNIFIX wordmark, drawn in monoline geometric strokes.</desc>

  <!-- mark -->
  <mask id="unifix-h-cut">
    <rect width="48" height="48" fill="#fff"/>
    <path d="M16 18 L21.5 24 L31.5 12.5" fill="none" stroke="#000"
          stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <path d="M24 46 C 16 34 9 27 9 19 A 15 15 0 1 1 39 19 C 39 27 32 34 24 46 Z"
        fill="#0E2F5C" mask="url(#unifix-h-cut)"/>

  <!-- constructed wordmark -->
  <g transform="translate(64 8)" fill="none" stroke="#0E2F5C" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 1 V16 A11 11 0 0 0 25 16 V1"/>
    <path d="M43 31 V1 L63 31 V1"/>
    <path d="M83 1 V31"/>
    <path d="M99 31 V1 H117 M99 15 H113"/>
    <path d="M131 1 V31"/>
    <path d="M147 1 L167 31 M167 1 L147 31"/>
  </g>
</svg>
