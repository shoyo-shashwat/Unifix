<!doctype html><meta charset="utf-8"><title>UNIFIX brand preview</title>
<style>
 body{font:14px system-ui;margin:0;background:#fff;color:#111}
 .row{display:flex;gap:24px;align-items:center;padding:18px 24px;border-bottom:1px solid #eee;flex-wrap:wrap}
 .dark{background:#0E2F5C;color:#fff}
 .mist{background:#F4F7FB}
 img{display:block}
 h3{width:100%;margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#889}
 .dark h3{color:#9db4d6}
</style>
<div class="row"><h3>mark — color @96 / 32 / 16, then mono @64, tile @96 / 40</h3>
 <img src="./unifix-mark.svg" width="96">
 <img src="./unifix-mark.svg" width="32">
 <img src="./unifix-mark.svg" width="16">
 <span style="color:#0E2F5C"><img src="./unifix-mark-mono.svg" width="64"></span>
 <img src="./unifix-tile.svg" width="96">
 <img src="./unifix-tile.svg" width="40">
</div>
<div class="row dark"><h3>mono on navy</h3>
 <span style="color:#fff"><img src="./unifix-mark-mono.svg" width="96"></span>
 <span style="color:#fff"><img src="./unifix-mark-mono.svg" width="20"></span>
</div>
<div class="row"><h3>horizontal lockup @400 / 180</h3>
 <img src="./unifix-logo-horizontal.svg" width="400">
 <img src="./unifix-logo-horizontal.svg" width="180">
</div>
<div class="row mist"><h3>stacked lockup @240</h3>
 <img src="./unifix-logo-stacked.svg" width="240">
</div>
<div class="row"><h3>qr badge over a fake qr</h3>
 <div style="position:relative;width:220px;height:220px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/26px 26px">
   <img src="./unifix-qr-badge.svg" width="80" style="position:absolute;left:70px;top:70px">
 </div>
</div>
<div class="row mist"><h3>philosophy @760</h3>
 <img src="./unifix-philosophy.svg" width="760">
</div>
